<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
    }
    .container {
        width: 100%;
        margin: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }
    nav {
        background: rgba(255, 255, 255, 0.95);
        padding: 15px 30px;
        border-radius: 0;
        margin-bottom: 0;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        position: relative;
        z-index: 1001;
    }
    .brand {
        font-weight: 600;
        color: #667eea;
        font-size: 1.2rem;
    }
    nav ul {
        list-style: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    nav li {
        display: inline;
    }
    nav a {
        text-decoration: none;
        color: #667eea;
        font-weight: 500;
        padding: 8px 16px;
        border-radius: 5px;
        transition: background 0.3s;
    }
    nav a:hover {
        background: #f0f0f0;
    }
    .user-menu-container {
        position: relative;
        margin-left: auto;
        z-index: 1002;
    }
    .user-menu-toggle {
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px 16px;
        border-radius: 5px;
        transition: background 0.3s;
        position: relative;
        z-index: 1002;
    }
    .user-menu-toggle:hover {
        background: #f0f0f0;
    }
    .user-menu-toggle .username {
        color: #667eea;
        font-weight: 500;
    }
    .user-dropdown {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        background: white;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        border-radius: 5px;
        min-width: 150px;
        margin-top: 5px;
        z-index: 1003;
    }
    .user-dropdown.active {
        display: block;
    }
    .user-dropdown .logout-btn {
        display: block;
        padding: 12px 20px;
        color: #dc3545;
        text-decoration: none;
        transition: background 0.3s;
        border-radius: 5px;
    }
    .user-dropdown .logout-btn:hover {
        background: #f8d7da;
    }
    .menu-toggle {
        display: none;
        flex-direction: column;
        background: none;
        border: none;
        cursor: pointer;
        padding: 5px;
        gap: 4px;
        position: relative;
        z-index: 1002;
    }
    .menu-toggle span {
        width: 25px;
        height: 3px;
        background: #667eea;
        border-radius: 3px;
        transition: all 0.3s;
    }
    .sidebar {
        width: 300px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 4px 0 6px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        position: relative;
    }
    .sidebar-header {
        padding: 20px;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .sidebar-header h2 {
        color: #667eea;
        font-size: 1.5rem;
        margin: 0;
    }
    .sidebar-close {
        display: none;
        background: none;
        border: none;
        font-size: 2rem;
        color: #667eea;
        cursor: pointer;
        padding: 0;
        width: 30px;
        height: 30px;
        line-height: 1;
    }
    .sidebar-nav {
        flex: 1;
        padding: 20px 0;
    }
    .sidebar-nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
    }
    .sidebar-nav li {
        margin: 0;
        width: 100%;
        display: block;
    }
    .sidebar-nav a {
        display: block;
        width: 100%;
        padding: 15px 20px;
        color: #333;
        text-decoration: none;
        transition: background 0.3s;
        border-right: 3px solid transparent;
        box-sizing: border-box;
    }
    .sidebar-nav a:hover {
        background: #f0f0f0;
        border-right-color: #667eea;
    }
    .sidebar-nav a.active {
        background: #f0f0f0;
        border-right-color: #667eea;
        color: #667eea;
        font-weight: 600;
    }
    .sidebar-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 998;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
    }
    .sidebar-overlay.active {
        opacity: 1;
        pointer-events: auto;
    }
    @media (max-width: 768px) {
        .menu-toggle {
            display: flex;
        }
        .main-wrapper {
            flex-direction: column;
        }
        .content {
            width: 100%;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            height: 100vh;
            z-index: 999;
            transition: left 0.3s ease;
            width: 100%;
            max-width: 320px;
            padding-top: 60px;
            box-sizing: border-box;
        }
        .sidebar.active {
            left: 0;
        }
        .sidebar-close {
            display: block;
        }
        .sidebar-overlay {
            display: block;
        }
    }
    .main-wrapper {
        display: flex;
        flex: 1;
        position: relative;
    }
    .content {
        background: white;
        padding: 40px;
        border-radius: 0;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        flex: 1;
    }
    .messages {
        margin-bottom: 20px;
    }
    .message {
        padding: 12px 20px;
        border-radius: 5px;
        margin-bottom: 10px;
    }
    .message.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    .message.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
    .message.info {
        background: #d1ecf1;
        color: #0c5460;
        border: 1px solid #bee5eb;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
        color: #333;
    }
    .form-control {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 16px;
    }
    .form-control:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s;
    }
    .btn-primary {
        background: #667eea;
        color: white;
    }
    .btn-primary:hover {
        background: #5568d3;
    }
    .errorlist {
        color: #dc3545;
        list-style: none;
        margin-top: 5px;
        font-size: 14px;
    }
    .form-links {
        margin-top: 20px;
        text-align: center;
    }
    .form-links a {
        color: #667eea;
        text-decoration: none;
    }
    .form-links a:hover {
        text-decoration: underline;
    }
    .auth-form-container {
        max-width: 400px;
        margin: 0 auto;
        padding: 20px;
    }
    .auth-form-container h1 {
        text-align: center;
        margin-bottom: 30px;
    }
    .auth-form-container form {
        width: 100%;
    }
    .auth-form-container .btn {
        width: 100%;
        display: block;
    }
    footer {
        background: rgba(255, 255, 255, 0.95);
        padding: 10px 30px;
        text-align: center;
        box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.1);
        margin-top: auto;
    }
    .footer-content {
        color: #667eea;
    }
    /* Стили для страницы проектов */
    .projects-container {
        display: flex;
        gap: 20px;
        height: calc(100vh - 200px);
        min-height: 500px;
    }
    .projects-list {
        width: 20%;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }
    .building-sites-cards,
    .projects-cards {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .building-site-card {
        background: #f9f9f9;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        padding: 12px;
        cursor: pointer;
        transition: all 0.2s;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }
    .building-site-card:hover {
        background: #f0f0f0;
        border-color: #667eea;
        box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
    }
    .building-site-card-content {
        display: flex;
        align-items: center;
        font-size: 14px;
        pointer-events: none;
    }
    .building-site-name {
        font-weight: 600;
        color: #667eea;
    }
    .no-sites {
        text-align: center;
        color: #999;
        padding: 20px;
    }
    .back-button {
        background: transparent;
        border: none;
        color: #667eea;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        padding: 8px 0;
        margin-bottom: 12px;
        transition: color 0.2s;
        text-align: left;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        min-height: 44px;
        display: flex;
        align-items: center;
    }
    .back-button:hover {
        color: #5568d3;
    }
    .back-to-projects-button {
        background: transparent;
        border: none;
        color: #667eea;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        padding: 12px 0;
        margin-bottom: 20px;
        transition: color 0.2s;
        text-align: left;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        min-height: 44px;
        display: flex;
        align-items: center;
    }
    .back-to-projects-button:hover {
        color: #5568d3;
    }
    .building-sites-view,
    .projects-view {
        display: flex;
        flex-direction: column;
        flex: 1;
    }
    .project-card {
        background: #f9f9f9;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        padding: 12px;
        cursor: pointer;
        transition: all 0.2s;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }
    .project-card:hover {
        background: #f0f0f0;
        border-color: #667eea;
        box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
    }
    .project-card.selected {
        background: #e3e8ff;
        border-color: #667eea;
        box-shadow: 0 2px 12px rgba(102, 126, 234, 0.3);
    }
    .project-card-content {
        display: grid;
        grid-template-columns: auto auto 1fr auto 45px;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        pointer-events: none;
    }
    .project-code {
        font-weight: 600;
        color: #667eea;
    }
    .project-separator {
        color: #999;
    }
    .project-status {
        display: flex;
        align-items: center;
    }
    .project-percent {
        font-weight: 600;
        color: #667eea;
        text-align: right;
    }
    .no-projects {
        text-align: center;
        color: #999;
        padding: 20px;
    }
    .status-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 12px;
        color: white;
        font-size: 12px;
        font-weight: 500;
    }
    .project-details {
        width: 80%;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
        display: flex;
        flex-direction: column;
    }
    .project-details-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #999;
        font-size: 18px;
    }
    .project-details-content {
        display: flex;
        flex-direction: column;
        height: 100%;
    }
    .project-details-header {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        padding-bottom: 20px;
        border-bottom: 2px solid #e0e0e0;
        margin-bottom: 20px;
    }
    .detail-item {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    .detail-label {
        font-weight: 600;
        color: #667eea;
        font-size: 12px;
        text-transform: uppercase;
    }
    .detail-value {
        font-size: 16px;
        color: #333;
    }
    .project-details-body {
        display: flex;
        gap: 20px;
        flex: 1;
    }
    .details-left-column {
        width: 70%;
        background: #f9f9f9;
        border-radius: 8px;
        padding: 20px;
    }
    .details-right-column {
        width: 30%;
        background: #f9f9f9;
        border-radius: 8px;
        padding: 20px;
    }
    @media (max-width: 768px) {
        .projects-container {
            flex-direction: column;
            height: auto;
        }
        .projects-list {
            width: 100%;
            max-height: 300px;
            overflow-y: auto;
        }
        .project-details {
            width: 100%;
        }
        .project-details-body {
            flex-direction: column;
        }
        .details-left-column,
        .details-right-column {
            width: 100%;
        }
        .building-site-card,
        .project-card {
            min-height: 48px;
            padding: 16px;
        }
        .building-site-card-content,
        .project-card-content {
            min-height: 20px;
        }
        .project-details-content {
            padding-top: 10px;
        }
    }
</style>
